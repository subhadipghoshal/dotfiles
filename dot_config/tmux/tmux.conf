# ~/.config/tmux/tmux.conf
#
# Hand-rolled config — no framework. Each concern lives in its own file under
# conf/, short enough to read top to bottom. If you don't remember why a line
# is there, it's a few lines away, not buried in someone else's 2000-line base.
# Replaced the old Oh My Tmux!-based setup on 2026-08-22 - that config (and its
# plugin clones) is preserved at ~/.config/tmux.pre-rebuild-backup-2026-08-22
# if anything here ever needs rolling back.
#
# Sandbox test (isolated server, never touches your real sessions):
#   ~/.config/tmux/run-sandbox.sh
#
# See CLAUDE.md in this directory for the full design writeup.

source-file "~/.config/tmux/conf/options.conf"
source-file "~/.config/tmux/conf/bindings.conf"
source-file "~/.config/tmux/conf/status.conf"
source-file "~/.config/tmux/conf/plugins.conf"
