# -- status line -------------------------------------------------------------
#
# Was a hand-rolled powerline imitation (arrow separators via octal-escaped
# Nerd Font glyphs, hand-tuned colourNNN segments) until 2026-09-02, when it
# broke on a different machine/terminal width. Root cause, confirmed by
# reading the old content rather than guessed: `status-justify absolute-centre`
# centred the window list against the *full* terminal width with no reflow,
# while `status-left-length 40` + `status-right-length 100` reserved 140
# columns for content that included unbounded `#(whoami)`/`#H` (full
# hostname) - on a narrower terminal, the centred window list collided with
# those reserved blocks. A separate, compounding risk: the arrow glyphs were
# Private Use Area codepoints with Unicode-ambiguous width, so a font-metric
# mismatch between machines could desync tmux's column math from what the
# terminal actually drew, with no error.
#
# Replaced with catppuccin/tmux (conf/plugins.conf) rather than another
# hand-rolled bar - see that file's catppuccin comment block and CLAUDE.md
# for why this plugin and what was deliberately dropped (the old
# PASSTHROUGH/COPY/SYNC mode flags and SSH-aware red hostname were custom
# logic, not something a theme plugin reproduces, and re-implementing them as
# custom segments would keep the exact maintenance burden this move was
# meant to end). The plugin now owns status-style, status-left/right,
# window-status-*, pane-border-style, message-style, clock-mode, and
# display-panes-colour.
#
# What's left here is only what's genuinely a site preference, independent of
# whichever theme owns the colors:

set -g status-position bottom   # tmux's own default is already bottom - written
                                 # down anyway so the choice stays legible instead
                                 # of implicit. prefix + t (bindings.conf) flips
                                 # this live for the running session without
                                 # touching this file's default.
