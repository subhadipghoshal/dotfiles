# -- status line: powerline/double/cyan theme, arrow separators restored --------
#
# same faithful color/segment structure as the old ~/.config/tmux setup (Oh My
# Tmux! + tmux-themepack, theme "powerline/double/cyan" - reverse-engineered by
# reading plugins/tmux-themepack/powerline/double/cyan.tmuxtheme directly and
# confirmed with a real PTY-attached client), but with the arrow/triangle
# powerline separators the flat-block version dropped - the flat style was
# theme-accurate but you specifically like the arrow shapes, so they're back.
# requires the Nerd/Powerline-patched font you already have installed (this is
# the one part of the flat rebuild's "no font dependency" win that arrows give
# back - same tradeoff your old theme had).
#
# the arrows are written as octal byte escapes (\356\202\260 etc.) rather than
# pasting the raw Unicode Private Use Area characters directly - tmux decodes
# \NNN escapes when it parses a config *file* (verified: it does NOT do this
# for a live `set` command, only file parsing), and plain digits survive
# copy/paste and editing far more reliably than invisible PUA glyphs would.
#   \356\202\260 = U+E0B0 (filled right-pointing arrow - status-left and the
#                  current-window highlight, both flow left-to-right)
#   \356\202\262 = U+E0B2 (filled left-pointing arrow - status-right only,
#                  flows right-to-left toward the screen's right edge)
#
# fg/bg convention differs by direction (confirmed against oh-my-tmux's own
# separator-building awk script in ~/.local/share/tmux/oh-my-tmux/.tmux.conf,
# since that's the ground truth for how the old theme's arrows actually
# looked): a ▶ is solid on its LEFT side tapering to a point on the right, so
# fg = the block *before* it, bg = the block *after* it (status-left, window
# highlight). A ◀ is mirrored - solid on its RIGHT side tapering to a point on
# the left - so it's backwards: fg = the block *after* it, bg = the block
# *before* it (status-right). Getting this swapped doesn't error, it just
# paints the wrong-colored triangle - that's what "the right side looks
# broken" turned out to be, fixed by swapping fg/bg on all three status-right
# arrows below.
#
# status-left is 3 blocks (session / whoami / window:pane), status-right is 3
# blocks (time / date / hostname), both bolder toward the outer screen edges.
# "double" (vs "default") only changes one thing vs. the base theme: the
# rightmost status-right block (hostname) is cyan instead of grey.
#
# the PASSTHROUGH/COPY/SYNC flags and the SSH-aware red hostname are this
# rebuild's own additions, in the same arrow style for consistency - each flag
# stays a flat block (no leading arrow) so it reads as an interruption/alert
# rather than a permanent part of the flow, then arrow-transitions into
# whatever comes next.
#
# what it answers at a glance:
#   left:  session name -> who you are -> window:pane
#   right: mid copy-mode / passthrough / sync flags -> time -> date -> hostname
#          (flips red over ssh)

set -g status-style "fg=colour243,bg=colour233"

# status-position: the one line to edit if you want to flip top/bottom. "top" keeps
# the bar visually separate from Neovim's own statusline+cmdline (which already own
# the bottom two rows of a pane); "bottom" is the conventional placement. "top" was
# tried first for that reason, but bottom is what actually felt right day to day -
# back to that. For a quick live A/B without editing this file, prefix + t (see
# bindings.conf) toggles it for the running session - handy for comparing, but a
# fresh reload/attach always starts from whatever this line says, so update it too
# once you've decided.
set -g status-position bottom

set -g status-justify absolute-centre   # center the window list across the full width,
                                         # not just the leftover space between left/right

set -g status-left-length 40
set -g status-left "#[fg=colour233,bg=colour39,bold] #S #[fg=colour39,bg=colour240,nobold]\356\202\260#[fg=colour233,bg=colour240] #(whoami) #[fg=colour240,bg=colour235]\356\202\260#[fg=colour240,bg=colour235] #I:#P #[fg=colour235,bg=colour233]\356\202\260#[default]"

# note: inside a #{?cond,TRUE,FALSE} ternary, commas are the branch delimiter -
# a multi-attribute style tag like #[fg=X,bg=Y] breaks the parser if it's
# embedded in a branch (the comma between fg= and bg= gets read as the
# TRUE/FALSE separator, truncating everything after it). the flag segments below
# use chained single-attribute tags instead: #[fg=X]#[bg=Y]. found this by
# testing a real attached client - `tmux display-message -p` reproduces the same
# truncation, so it's a reliable way to test format strings like this. a nested
# #{?...} used as a single attribute's *value* (e.g. bg=#{?cond,A,B} below) is a
# different, safe case - its commas are fully bracket-contained, confirmed
# working in the SSH-conditional hostname background.
set -g status-right-length 100
set -g status-right "#{?#{==:#{client_key_table},off},#[fg=colour232]#[bg=colour208]#[bold] PASSTHROUGH ,}#{?pane_in_mode,#[fg=colour232]#[bg=colour208]#[bold] COPY ,}#{?synchronize-panes,#[fg=colour232]#[bg=colour208]#[bold] SYNC ,}#[fg=colour235,bg=#{?#{||:#{||:#{==:#{client_key_table},off},#{pane_in_mode}},#{synchronize-panes}},colour208,colour233}]\356\202\262#[fg=colour240,bg=colour235] %H:%M:%S #[fg=colour240,bg=colour235]\356\202\262#[fg=colour233,bg=colour240] %d-%b-%y #[fg=#{?#{==:#{pane_current_command},ssh},colour160,colour39},bg=colour240]\356\202\262#[fg=colour233,bg=#{?#{==:#{pane_current_command},ssh},colour160,colour39},bold] #H "

setw -g window-status-current-style "fg=colour81,bg=black,nobold"
setw -g window-status-current-format "#[fg=colour233,bg=black]\356\202\260#[fg=colour81,bg=black,nobold] #I:#W#F #[fg=black,bg=colour233]\356\202\260#[default]"
setw -g window-status-style "fg=colour243,bg=colour233"
setw -g window-status-format "  #I:#W#F  "
setw -g window-status-separator ""

set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"

set -g message-style "fg=black,bg=colour39"
set -g message-command-style "fg=black,bg=colour39"

set -g clock-mode-colour colour39
set -g clock-mode-style 24

set -g display-panes-colour colour233
set -g display-panes-active-colour colour245
