# -- plugins (via TPM) --------------------------------------------------------
#
# Five plugins, each earning its place against native tmux 3.7 / hand-written
# alternatives:
#   - vim-tmux-navigator: seamless Neovim <-> tmux pane navigation, no native
#     equivalent.
#   - tmux-logging: pane logging / screen capture / full-history dump, no
#     native equivalent. See CHEATSHEET.txt for its bindings.
#   - tmux-agent-sidebar: cross-pane visibility into running Claude
#     Code/Codex/OpenCode agents (status, prompts, activity). Requires a
#     matching hook registration in ~/.claude/settings.json - see that
#     repo/file, not this one, for the agent-side half of the wiring.
#   - catppuccin/tmux: the status line, replacing a hand-rolled powerline
#     imitation on 2026-09-02 after it broke on a different machine/terminal
#     width - see conf/status.conf's header and CLAUDE.md for the root cause
#     and why this specific plugin. Owns status-style, status-left/right,
#     window-status-*, pane-border-style, message-style, clock-mode, and
#     display-panes-colour; conf/status.conf keeps only status-position.
#   - tpm itself, kept for its install/update/uninstall hotkeys.
#
# A batch of six more (tmux-sensible, tmux-resurrect, tmux-continuum,
# tmux-prefix-highlight, tmux-copycat, tmux-yank) was added and installed in
# one shot on 2026-09-01 and removed again on 2026-09-02 after an audit found
# each one either redundant with something already hand-written here,
# actively wrong on tmux 3.7 (tmux-copycat's own last commit says as much -
# native regex search since 3.1 replaced it), or silently overriding a
# documented binding with no guard (tmux-yank took over copy-mode-vi `y` from
# scripts/clip.sh with zero conflict detection). See CLAUDE.md for the full
# writeup. General lesson for anything added here in the future: this file is
# sourced LAST (see tmux.conf), so an unguarded plugin binding always wins
# over anything set in bindings.conf/options.conf/status.conf - check
# `tmux list-keys` after installing.
#
# TPM hotkeys (its own defaults, see bindings.conf for the full list):
#   prefix + I install   prefix + U update   prefix + alt + u uninstall

# pinned explicitly rather than relying on TPM's auto-detection (belt-and-
# suspenders below explains why that auto-detection was flaky while this lived
# at ~/.config/tmux-scratch during development - moot now that it's promoted
# to the real path, but harmless to leave pinned)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'hiroppy/tmux-agent-sidebar'
set -g @plugin 'catppuccin/tmux#v2.3.0'  # pinned - see https://github.com/catppuccin/tmux/tags

set -g @vim_navigator_mapping_left "C-h"
set -g @vim_navigator_mapping_right "C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""     # frees up C-\ (not used here)

# tmux-logging: keep its output out of $HOME (its own default for all three
# of these) - route into one clearly-named directory instead. Created on
# first use by the plugin's own mkdir -p.
set -g @logging-path "~/.config/tmux/logs"
set -g @screen-capture-path "~/.config/tmux/logs"
set -g @save-complete-history-path "~/.config/tmux/logs"

# tmux-agent-sidebar: opt-in via prefix + e instead of a pane auto-injected
# into every new window (that's @sidebar_auto_create's default, "on") -
# matches this config's popups-not-extra-panes stance. prefix + E toggles
# every sidebar at once (see CHEATSHEET.txt).
set -g @sidebar_auto_create off

# catppuccin/tmux: the status line. Following the plugin's own documented
# "recommended default configuration" verbatim rather than inventing a
# custom arrangement - status-left empty, every segment composed into
# status-right via its pre-styled #{E:@catppuccin_status_*} tokens. Token
# names verified against the plugin's own status/*.conf source files, not
# guessed: session.conf -> @catppuccin_status_session, user.conf ->
# @catppuccin_status_user, date_time.conf -> @catppuccin_status_date_time.
# host.conf (@catppuccin_status_host, full hostname via #H) was dropped
# 2026-09-02 - took up space for no real benefit. Deliberately no
# status-justify override (tmux's own default, "left", is what's wanted here)
# and no separate status-left/right-length beyond the plugin's own
# recommended 100/100 - neither pairs with a centre-justify the way the old
# hand-rolled bar's absolute-centre + fixed-budget combination did, which is
# what actually broke on a different terminal width. See CLAUDE.md.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

run "~/.config/tmux/plugins/tpm/tpm"

set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# belt-and-suspenders: TPM's *discovery* step re-parses ~/.config/tmux/tmux.conf
# from disk (hardcoded, no override) to find @plugin lines - it read the wrong
# file entirely while this config was staged at ~/.config/tmux-scratch during
# development, which is what this line originally worked around. Now that
# ~/.config/tmux IS that exact real path, TPM's own discovery works too, so
# this is redundant with prefix + I/U/alt-u - left in anyway, since it's a
# harmless no-op and guarantees the plugin's bindings are live even before you
# ever run TPM's install.
run-shell "~/.config/tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux"
