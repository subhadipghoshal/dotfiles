# A new tmux server inherits its launcher's environment before it creates the
# first pane. Seed an explicit human override and discard agent markers so a
# direct `tmux new-session` starts a healthy interactive shell. The shell keeps
# the zero locally but removes its export flag, allowing bare agent children to
# identify themselves normally.
set-environment -g ZSH_AGENT_MODE 0
set-environment -gu CLAUDECODE
set-environment -gu CI
set-environment -gu CODEX_SANDBOX
set-environment -gu CURSOR_AGENT
set-environment -gu OPENCODE

# -- terminal & rendering ------------------------------------------------------

set -sg escape-time 10                    # default 500ms makes vim's <Esc>/O feel laggy
set -g focus-events on                    # let Neovim see FocusGained/FocusLost through tmux
set -g history-limit 50000

# true color + undercurl passthrough, so Neovim's LSP diagnostics (squiggly
# underlines) and colorschemes render correctly through tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-overrides ",*:Smulx=\\E[4::%p1%dm"                                              # undercurl
set -as terminal-overrides ",*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"  # undercurl color

# Let Ghostty's Kitty graphics protocol reach Neovim, so snacks.image can draw
# images and mermaid diagrams inline in a markdown buffer. Without this tmux
# swallows the escape sequences and nothing renders and nothing errors.
set -gq allow-passthrough on

# -- indexing & renumbering ------------------------------------------------------

set -g base-index 1                       # windows start at 1, matching the keyboard row
setw -g pane-base-index 1                 # panes start at 1 too
set -g renumber-windows on                # no gaps when a window in the middle closes

# -- window naming ---------------------------------------------------------------

set -g automatic-rename on                # falls back to the running command's name
set -g allow-rename on                    # ...but let well-behaved programs override it via title
                                           # escape sequences (OSC 0/2) for richer status - this is
                                           # what makes e.g. Neovim show "file.lua (~/proj)" instead
                                           # of just "nvim" in the window list. See status.conf and
                                           # CLAUDE.md for what has to be true on the program's side.

# -- copy mode & clipboard --------------------------------------------------------

setw -g mode-keys vi                      # vi-style navigation in copy mode
set -g set-clipboard on                   # let tmux relay copies to the terminal's clipboard (OSC 52)
                                           # this alone gets remote-pane copies back to your Mac in most
                                           # terminals; scripts/clip.sh (bound in bindings.conf) is the
                                           # explicit fallback for cases where that passthrough is flaky

# -- misc quality of life -----------------------------------------------------

set -g mouse on
set -g status-interval 1                  # refresh every second - the status line shows
                                           # live seconds (%H:%M:%S), matching the old theme
