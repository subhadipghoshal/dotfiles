# -- prefix ----------------------------------------------------------------------

# C-a: screen-style, easy reach (right next to physical Ctrl on a standard
# layout). Shadows readline's beginning-of-line and Neovim's Ctrl-a (increment
# number) - double-tap (C-a a) sends either through when you need it, same
# mechanism as any prefix change. Picked over C-Space after C-Space turned out
# to be intercepted by macOS's system-wide "select previous input source"
# shortcut before it ever reached the terminal.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# -- reload ------------------------------------------------------------------

bind r source-file "~/.config/tmux/tmux.conf" \; display "config reloaded"

# -- splits & windows: keep the current pane's working directory -----------------

unbind '"'
unbind %
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
# fallback for both of the above: if Ctrl is still held down when you press the
# second key (easy to do right after C-a), the terminal doesn't send the literal
# symbol byte, it sends a control byte instead - 0x1c for '|' (it shares a physical
# key with '\', and Ctrl-key control codes only depend on the key's low 5 bits,
# which are identical for '\' and its shifted form '|'), 0x1f for '-'. tmux's names
# for those bytes are C-\ and C-_. bind them to the same commands so both splits
# work whichever way Ctrl lands, without you having to think about it.
bind C-\\ split-window -h -c "#{pane_current_path}"
bind C-_ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# -- pane resizing (navigation itself is handled by vim-tmux-navigator, see
#    plugins.conf, so it works identically whether focus is on a tmux pane or a
#    vim split) --------------------------------------------------------------

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# note: prefix + z (zoom toggle) is a tmux default, no rebind needed

# -- window navigation ---------------------------------------------------------
#
# prefix + n / p (next/prev), prefix + l (last active window, alt-tab style),
# prefix + 1-9 (jump by number), prefix + w (interactive tree picker) are all
# tmux defaults, untouched, and already work.
#
# added here: instant window switching with no prefix at all, mirroring the
# Ctrl-h/j/k/l you already use for panes - Ctrl = panes, Ctrl+Alt = windows.
#
# these were plain Alt (M-h / M-l / M-1..M-9) from the 2026-08-22 rebuild
# until 2026-09-03, and worked fine on their own. They moved to Ctrl+Alt
# because AeroSpace, the macOS tiling window manager for GUI apps adopted
# that day, owns the entire plain-Alt namespace for GUI window management
# (alt-1..9 = workspaces, alt-h/j/k/l = window focus) and grabs those chords
# at the OS level, before any terminal ever sees them - not a conflict tmux
# could win, so the terminal side moved instead.
#
# Ctrl+Alt is specifically the *reliable* escape hatch on macOS, not just a
# free one. Ghostty only forwards Option as Meta when the Option-sequence
# produces no printable character (macos-option-as-alt, which defaults to
# true on a U.S. Standard layout - hence the old plain-Alt binds working),
# but per Ghostty's own docs an Option chord that also includes Ctrl is
# treated as Alt regardless of that setting. So C-M-<key> survives even if
# macos-option-as-alt is ever turned off, on a non-U.S. layout, or in a
# different terminal.
#
# no `set -s extended-keys on` needed: tmux 3.7 requests extended keys
# itself whenever the terminal advertises support (Ghostty does), which is
# what lets it tell C-M-<digit> apart from a bare digit.
#
# see CLAUDE.md, "Design decisions" -> "AeroSpace (GUI window manager)
# coexistence", for the full rationale and the fallback if a terminal ever
# lacks this support (prefix + 1-9 still works, untouched).

bind -n C-M-h previous-window
bind -n C-M-l next-window
bind -n C-M-1 select-window -t :1
bind -n C-M-2 select-window -t :2
bind -n C-M-3 select-window -t :3
bind -n C-M-4 select-window -t :4
bind -n C-M-5 select-window -t :5
bind -n C-M-6 select-window -t :6
bind -n C-M-7 select-window -t :7
bind -n C-M-8 select-window -t :8
bind -n C-M-9 select-window -t :9

# -- nested tmux (SSHing into a box that's also running tmux) --------------------
#
# prefix + prefix (e.g. C-b C-b) already sends a literal prefix keystroke
# through to the inner session by default - that covers one-off commands.
#
# for extended work inside the inner session, F12 toggles "passthrough" mode:
# it disables the *outer* prefix entirely until you hit F12 again. It also
# sets status-style/window-status-current-style as a dim reminder, but since
# conf/plugins.conf's catppuccin theme (2026-09-02) embeds its own #[fg=...,
# bg=...] tags directly inside window-status-format and each status-right
# segment token, those embedded tags win over this dim override for any
# space they cover - only the bar's uncovered background actually dims now,
# not the colorful segments themselves. The prefix-disable still fires
# either way; this only weakens the visual cue. See CLAUDE.md.

bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    set status-style "fg=colour245,bg=colour238" \;\
    set window-status-current-style "fg=colour245,bg=colour238" \;\
    refresh-client -S

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-style \;\
    set -u window-status-current-style \;\
    refresh-client -S

# -- sessionizer: fuzzy-jump to a project, creating its session if needed --------
#
# runs in a popup so fzf gets a real TTY; edit SESSIONIZER_DIRS in the script to
# change which directories it searches

bind f display-popup -E -w 80% -h 80% "~/.config/tmux/scripts/sessionizer.sh"

# -- session switcher: fzf list of *already open* sessions, switch to one -------
#
# overrides tmux's default prefix + s (choose-session, a plain tree view) with
# an fzf popup to match - unbind the override below to get the tree view back

bind s display-popup -E -w 80% -h 80% "~/.config/tmux/scripts/session-switcher.sh"

# -- popups: scratch terminal / lazygit without disturbing the current layout ----

bind g display-popup -E -w 90% -h 90% "lazygit"
bind Space display-popup -E -w 80% -h 80% "tmux new-session -A -s scratch -e ZSH_AGENT_MODE=0 -e CLAUDECODE= -e CI= -e CODEX_SANDBOX= -e CURSOR_AGENT= -e OPENCODE="

# yazi as a file manager popup - unlike a bare `yazi`, quitting with q sends
# a `cd` for wherever you navigated to back into the pane that opened this
# popup (see scripts/yazi-popup.sh; Q discards it, same distinction as the
# `y` shell wrapper in ~/.zsh/35-yazi.zsh). Bare `y` was free in this prefix
# table - only bound elsewhere inside the separate copy-mode-vi table, for
# clipboard yank (below) - so it doubles as the mnemonic for "yazi".
bind y display-popup -E -w 90% -h 90% "~/.config/tmux/scripts/yazi-popup.sh '#{pane_id}'"

# -- extras -----------------------------------------------------------------

# broadcast keystrokes to every pane in the window - handy for running the same
# command across several ssh panes at once. The `display` below pops up a
# one-off "sync on/off" message toast - status.conf itself no longer shows a
# persistent SYNC flag in the bar (that was hand-rolled, dropped along with
# PASSTHROUGH/COPY when the status line moved to catppuccin/tmux, 2026-09-02 -
# see CLAUDE.md).
bind b setw synchronize-panes \; display "sync #{?synchronize-panes,on,off}"

# kill the whole session, with confirmation - mirrors the default prefix + x
# (kill-pane), useful once the sessionizer piles up sessions you're done with
bind X confirm-before -p "kill session #S? (y/n)" "kill-session"

# pick a URL out of the pane's visible content + scrollback and open it -
# useful in a full-screen terminal where reaching for the mouse is friction
bind o display-popup -E -w 80% -h 80% "~/.config/tmux/scripts/open-url.sh '#{pane_id}'"

# hide/show the status bar entirely - reclaim the row for a demo, recording,
# or just more vertical space
bind T if-shell -F "#{==:#{status},on}" "set -g status off" "set -g status on"

# flip the status bar between top/bottom for the running session - a quick live A/B,
# doesn't persist across reload/attach (that's conf/status.conf's status-position
# line, which is the actual default)
bind t if-shell -F "#{==:#{status-position},top}" \
    "set -g status-position bottom; display 'status: bottom'" \
    "set -g status-position top; display 'status: top'"

# curated cheat sheet of the bindings actually defined in this config, with
# descriptions - prefix + ? (tmux's own default, untouched) still gives you
# the raw, unfiltered dump of every binding including tmux's and any plugin's.
# CHEATSHEET.txt is a plain static file - update it by hand when you change a
# binding here, it is not generated from this file.
bind h display-popup -E -w 70% -h 80% "less -R ~/.config/tmux/CHEATSHEET.txt"

# -- copy mode: yank to system clipboard (local pbcopy, remote via OSC 52) -------

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "~/.config/tmux/scripts/clip.sh"

# -- plugin manager (TPM) hotkeys, for reference - these are TPM's own defaults,
#    not redefined here: -------------------------------------------------------
#   prefix + I        install plugins listed in plugins.conf
#   prefix + U         update installed plugins
#   prefix + alt + u   uninstall plugins no longer listed
